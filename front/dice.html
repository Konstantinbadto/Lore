<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальные кубики для RPG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        h2 {
            margin-bottom: 20px;
            color: #ffd700;
        }

        .master-controls, .player-controls, .results {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .dice-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .dice-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .master-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .master-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .status-enabled {
            background: linear-gradient(45deg, #00b894, #00a085);
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }

        .status-disabled {
            background: linear-gradient(45deg, #636e72, #2d3436);
            box-shadow: 0 4px 15px rgba(99, 110, 114, 0.3);
        }

        .dice-icon-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }

        .dice-icon-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ffd700, #ff6b6b);
            border: none;
            font-size: 2em;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .dice-icon-btn:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 12px 35px rgba(255, 215, 0, 0.6);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .dice-menu {
            position: fixed;
            bottom: 120px;
            right: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1001;
            color: #333;
            min-width: 200px;
        }

        .dice-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ffd700;
        }

        .dice-menu-header h3 {
            color: #333;
            margin: 0;
        }

        .close-menu {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .close-menu:hover {
            color: #ff6b6b;
        }

        .dice-menu-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .dice-menu-btn {
            padding: 12px;
            border: 2px solid #ffd700;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .dice-menu-btn:hover {
            background: #ffd700;
            transform: translateY(-2px);
        }

        .animation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .dice-animation {
            text-align: center;
        }

        .dice {
            font-size: 8em;
            margin-bottom: 20px;
            animation: roll 1s ease-out;
        }

        .rolling-text {
            font-size: 2em;
            color: #ffd700;
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes roll {
            0% { transform: rotate(0deg) scale(0.5); opacity: 0; }
            50% { transform: rotate(180deg) scale(1.2); opacity: 1; }
            100% { transform: rotate(360deg) scale(1); opacity: 1; }
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ffd700; }
            to { text-shadow: 0 0 20px #ff6b6b, 0 0 30px #ffd700; }
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .result-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #ffd700;
        }

        .result-dice {
            font-size: 1.2em;
            font-weight: bold;
            color: #ffd700;
        }

        .result-value {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
            text-align: center;
        }

        .result-time {
            font-size: 0.9em;
            color: #aaa;
            text-align: right;
        }

        .player-name {
            color: #ff6b6b;
            font-weight: bold;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .dice-buttons {
                flex-direction: column;
            }

            .dice-btn {
                width: 100%;
            }

            .dice-menu-buttons {
                grid-template-columns: 1fr;
            }

            .dice-icon-container {
                bottom: 20px;
                right: 20px;
            }

            .dice-menu {
                right: 20px;
                left: 20px;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 Виртуальные кубики для RPG</h1>

        <!-- Панель мастера -->
        <div class="master-controls">
            <h2>🎮 Панель мастера</h2>
            <p>Разрешить броски кубиков:</p>
            <div class="dice-buttons">
                <button class="dice-btn master-btn" onclick="allowDice('d4')">Разрешить d4</button>
                <button class="dice-btn master-btn" onclick="allowDice('d6')">Разрешить d6</button>
                <button class="dice-btn master-btn" onclick="allowDice('d8')">Разрешить d8</button>
                <button class="dice-btn master-btn" onclick="allowDice('d10')">Разрешить d10</button>
                <button class="dice-btn master-btn" onclick="allowDice('d12')">Разрешить d12</button>
                <button class="dice-btn master-btn" onclick="allowDice('d20')">Разрешить d20</button>
                <button class="dice-btn master-btn" onclick="allowDice('d100')">Разрешить d100</button>
                <button class="dice-btn master-btn" onclick="allowAllDice()">Разрешить все</button>
                <button class="dice-btn master-btn" onclick="disallowAllDice()">Запретить все</button>
            </div>
        </div>

        <!-- Панель игрока -->
        <div class="player-controls">
            <h2>👤 Панель игрока</h2>
            <div id="status" class="status status-disabled">
                Ожидание разрешения мастера...
            </div>

            <!-- Плавающая кнопка с иконкой кубика -->
            <div class="dice-icon-container">
                <button class="dice-icon-btn" id="diceIconBtn">
                    🎲
                </button>
            </div>

            <!-- Меню выбора кубиков -->
            <div class="dice-menu" id="diceMenu">
                <div class="dice-menu-header">
                    <h3>Выберите кубик</h3>
                    <button class="close-menu" onclick="closeDiceMenu()">×</button>
                </div>
                <div class="dice-menu-buttons">
                    <button class="dice-menu-btn" onclick="initiateRoll('d4')">d4</button>
                    <button class="dice-menu-btn" onclick="initiateRoll('d6')">d6</button>
                    <button class="dice-menu-btn" onclick="initiateRoll('d8')">d8</button>
                    <button class="dice-menu-btn" onclick="initiateRoll('d10')">d10</button>
                    <button class="dice-menu-btn" onclick="initiateRoll('d12')">d12</button>
                    <button class="dice-menu-btn" onclick="initiateRoll('d20')">d20</button>
                    <button class="dice-menu-btn" onclick="initiateRoll('d100')">d100</button>
                </div>
            </div>

            <!-- Оверлей для анимации -->
            <div class="animation-overlay" id="animationOverlay">
                <div class="dice-animation">
                    <div class="dice" id="rollingDice">🎲</div>
                    <div class="rolling-text" id="rollingText">Бросок...</div>
                </div>
            </div>
        </div>

        <!-- Результаты бросков -->
        <div class="results">
            <h2>📊 Результаты бросков</h2>
            <div id="results-container" class="results-grid"></div>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let allowedDice = [];
        let rollHistory = [];
        const playerName = "Игрок"; // В реальном приложении это бы получалось из системы

        // Элементы DOM
        const statusElement = document.getElementById('status');
        const diceMenu = document.getElementById('diceMenu');
        const animationOverlay = document.getElementById('animationOverlay');
        const rollingDice = document.getElementById('rollingDice');
        const rollingText = document.getElementById('rollingText');
        const resultsContainer = document.getElementById('results-container');
        const diceIconBtn = document.getElementById('diceIconBtn');

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            diceIconBtn.addEventListener('click', toggleDiceMenu);
            updateStatus();
        });

        // Функции мастера
        function allowDice(diceType) {
            if (!allowedDice.includes(diceType)) {
                allowedDice.push(diceType);
                updateStatus();
                showNotification(`Разрешены броски ${diceType}`, 'success');
            }
        }

        function allowAllDice() {
            allowedDice = ['d4', 'd6', 'd8', 'd10', 'd12', 'd20', 'd100'];
            updateStatus();
            showNotification('Все кубики разрешены!', 'success');
        }

        function disallowAllDice() {
            allowedDice = [];
            updateStatus();
            showNotification('Все кубики запрещены', 'warning');
        }

        // Функции игрока
        function toggleDiceMenu() {
            if (allowedDice.length === 0) {
                showNotification('Мастер не разрешил броски кубиков', 'error');
                return;
            }
            diceMenu.style.display = diceMenu.style.display === 'block' ? 'none' : 'block';
        }

        function closeDiceMenu() {
            diceMenu.style.display = 'none';
        }

        function initiateRoll(diceType) {
            if (!allowedDice.includes(diceType)) {
                showNotification(`Броски ${diceType} запрещены мастером`, 'error');
                closeDiceMenu();
                return;
            }

            closeDiceMenu();
            showAnimation(diceType);

            // Имитация задержки броска
            setTimeout(() => {
                const result = rollDice(diceType);
                hideAnimation();
                addToHistory(diceType, result);
                showNotification(`Бросок ${diceType}: ${result}`, 'success');
            }, 2000);
        }

        function rollDice(diceType) {
            const max = parseInt(diceType.substring(1));
            return Math.floor(Math.random() * max) + 1;
        }

        // Анимации
        function showAnimation(diceType) {
            const diceIcons = {
                'd4': '🎲',
                'd6': '🎲',
                'd8': '🎲',
                'd10': '🎲',
                'd12': '🎲',
                'd20': '🎯',
                'd100': '💯'
            };

            rollingDice.textContent = diceIcons[diceType] || '🎲';
            rollingText.textContent = `Бросок ${diceType}...`;
            animationOverlay.style.display = 'flex';
        }

        function hideAnimation() {
            animationOverlay.style.display = 'none';
        }

        // Управление историей и отображением
        function addToHistory(diceType, result) {
            const roll = {
                id: Date.now(),
                player: playerName,
                dice: diceType,
                result: result,
                timestamp: new Date().toLocaleTimeString()
            };

            rollHistory.unshift(roll);
            updateResultsDisplay();
        }

        function updateResultsDisplay() {
            resultsContainer.innerHTML = '';

            rollHistory.slice(0, 12).forEach(roll => {
                const resultElement = document.createElement('div');
                resultElement.className = 'result-item';
                resultElement.innerHTML = `
                    <div class="result-dice">${roll.dice.toUpperCase()}</div>
                    <div class="result-value">${roll.result}</div>
                    <div class="player-name">${roll.player}</div>
                    <div class="result-time">${roll.timestamp}</div>
                `;
                resultsContainer.appendChild(resultElement);
            });
        }

        function updateStatus() {
            if (allowedDice.length === 0) {
                statusElement.textContent = 'Ожидание разрешения мастера...';
                statusElement.className = 'status status-disabled';
            } else {
                const diceList = allowedDice.join(', ');
                statusElement.textContent = `Разрешены: ${diceList}`;
                statusElement.className = 'status status-enabled';
            }
        }

        function showNotification(message, type) {
            // Создаем уведомление
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 8px;
                color: white;
                font-weight: bold;
                z-index: 3000;
                transform: translateX(400px);
                transition: transform 0.3s ease;
                max-width: 300px;
            `;

            const colors = {
                success: 'linear-gradient(45deg, #00b894, #00a085)',
                error: 'linear-gradient(45deg, #ff6b6b, #ee5a24)',
                warning: 'linear-gradient(45deg, #fdcb6e, #e17055)'
            };

            notification.style.background = colors[type] || colors.success;
            notification.textContent = message;

            document.body.appendChild(notification);

            // Анимация появления
            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 100);

            // Автоматическое скрытие
            setTimeout(() => {
                notification.style.transform = 'translateX(400px)';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }

        // Глобальное закрытие меню при клике вне его
        document.addEventListener('click', function(event) {
            if (!diceMenu.contains(event.target) && !diceIconBtn.contains(event.target)) {
                closeDiceMenu();
            }
        });
    </script>
</body>
</html>
