<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lore - Вход в Хроники</title>

    <link rel="stylesheet" href="style-login.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <div class="container">
            <!-- Левая панель (как в регистрации) -->
            <div class="left-panel">
                <div class="logo">
                    <h1>LORE</h1>
                    <p>Хроники Эландрии</p>
                </div>
                <div class="ancient-gate">
                    <i class="fas fa-door-open"></i>
                </div>
                <div class="lore-text">
                    <h3>Возвращение Мудреца</h3>
                    <p>С возвращением, хранитель тайных знаний! Фиолетовые врата открываются только для посвящённых.</p>
                </div>
            </div>

            <!-- Правая панель с формой -->
            <div class="right-panel">
                <div class="login-form">
                    <h2 class="form-title">Вход в Архив</h2>

                    <form @submit.prevent="submitLogin">
                        <div class="form-group">
                            <label>Магический Адрес или Логин:</label>
                            <input
                                type="text"
                                class="form-control"
                                v-model="form.identifier"
                                placeholder="ajrihkosta@gmail.com или константин"
                                required>
                        </div>

                        <div class="form-group">
                            <label>Защитная Руна:</label>
                            <input
                                type="password"
                                class="form-control"
                                v-model="form.password"
                                placeholder="Введите пароль"
                                required>
                        </div>

                        <button type="submit" :disabled="loading" class="submit-btn">
                            {{ loading ? 'Открытие Врат...' : 'Войти в Архив' }}
                        </button>
                    </form>

                    <!-- Ссылка на регистрацию по центру внизу -->
                    <div class="register-link">
                        <p>Ещё не присягнули Гильдии?
                            <a href="reg.html">Принесите клятву</a>
                        </p>
                    </div>

                    <div class="message" :class="{ 'success': message.success, 'error': !message.success }" v-if="message.text">
                        {{ message.text }}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    form: {
                        identifier: 'ajrihkosta@gmail.com',
                        password: ''
                    },
                    loading: false,
                    message: { text: '', success: false }
                };
            },
            methods: {
                async submitLogin() {
                    if (!this.form.identifier || !this.form.password) {
                        this.showMessage('Заполните все поля', false);
                        return;
                    }

                    this.loading = true;
                    this.message.text = '';

                    try {
                        const res = await fetch('http://localhost:3307/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                email: this.form.identifier.trim(),
                                password: this.form.password
                            })
                        });

                        const result = await res.json();

                        if (res.ok && result.success) {
                            localStorage.setItem('token', result.token);
                            localStorage.setItem('current_user', JSON.stringify(result.user));
                            this.showMessage('Вход выполнен успешно!', true);
                            setTimeout(() => window.location.href = 'dashboard.html', 1500);
                        } else {
                            this.showMessage(result.error || 'Неверный логин или пароль', false);
                        }
                    } catch (err) {
                        this.showMessage('Не удалось подключиться к серверу', false);
                    } finally {
                        this.loading = false;
                    }
                },

                showMessage(text, success) {
                    this.message.text = text;
                    this.message.success = success;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
